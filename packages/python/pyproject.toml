[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "streamtario-packages"
version = "0.1.0"
description = "Shared Python packages for the Streamtario project"
requires-python = ">=3.8"
dependencies = [
    "pydantic"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]